name: Generate contribution games

# Builds the animated contribution SVGs shown in README.md and publishes them
# to the `output` branch. Both generators write into dist/ so a single publish
# step covers them; keeping them in one workflow stops the two publishes from
# overwriting each other on the output branch.
#
# Files published:
#   pacman-contribution-graph.svg / pacman-contribution-graph-dark.svg  (used in README)
#   github-snake.svg / github-snake-dark.svg                            (kept available)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Pac-Man SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: prakash116
          games: pacman
          player_style: opportunistic

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: prakash116
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0f172a&color_dots=#e2e8f0,#a5f3fc,#67e8f9,#22d3ee,#0891b2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#164e63,#0e7490,#06b6d4,#67e8f9

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
