<svg width="1100" height="270" viewBox="0 0 1100 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Let's build something meaningful together</title>
  <desc id="description">A futuristic developer collaboration terminal showing Prakash Mani is available to connect.</desc>
  <defs>
    <linearGradient id="panel" x1="20" y1="10" x2="1080" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset=".55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="accent" x1="320" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#22D3EE" stop-opacity=".3"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="270" rx="22" fill="url(#panel)"/>
  <rect x=".75" y=".75" width="1098.5" height="268.5" rx="21.25" stroke="#164E63" stroke-width="1.5"/>
  <circle cx="550" cy="140" r="260" fill="url(#glow)" opacity=".28">
    <animate attributeName="opacity" values=".18;.42;.18" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g stroke="#0891B2" stroke-opacity=".5">
    <path d="M0 66H155L200 111H330"/>
    <path d="M0 221H180L225 176H330"/>
    <path d="M1100 66H945L900 111H770"/>
    <path d="M1100 221H920L875 176H770"/>
  </g>
  <g fill="#22D3EE" filter="url(#softGlow)">
    <circle cx="200" cy="111" r="4"><animate attributeName="r" values="3;6;3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="225" cy="176" r="4"><animate attributeName="r" values="6;3;6" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="111" r="4"><animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="875" cy="176" r="4"><animate attributeName="r" values="6;3;6" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(62 30)" font-family="Consolas, 'Courier New', monospace">
    <rect width="186" height="31" rx="15.5" fill="#052E2B" stroke="#10B981" stroke-opacity=".65"/>
    <circle cx="18" cy="15.5" r="5" fill="#34D399" filter="url(#softGlow)">
      <animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="20" fill="#A7F3D0" font-size="12" font-weight="700" letter-spacing="1.5">OPEN TO CONNECT</text>
  </g>

  <g text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">
    <text x="550" y="83" fill="#94A3B8" font-size="14" font-weight="600" letter-spacing="4">HAVE AN IDEA?</text>
    <text x="550" y="133" fill="#F8FAFC" font-size="34" font-weight="700">Let’s build something meaningful.</text>
    <text x="550" y="169" fill="#CBD5E1" font-size="17">Great products begin with a thoughtful conversation.</text>
    <rect x="368" y="191" width="364" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="40;364;40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="530;368;530" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="550" y="229" fill="#22D3EE" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="2">CONNECT  •  COLLABORATE  •  CREATE</text>
  </g>

  <g fill="none" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 155">
    <path pathLength="160" d="M155 66L200 111H330"><animate attributeName="stroke-dashoffset" values="160;0" dur="2.5s" repeatCount="indefinite"/></path>
    <path pathLength="160" d="M945 66L900 111H770"><animate attributeName="stroke-dashoffset" values="0;-160" dur="2.5s" repeatCount="indefinite"/></path>
  </g>
</svg>
