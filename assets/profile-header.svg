<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Prakash Mani — Full-Stack and Mobile App Developer</title>
  <desc id="desc">A dark blue developer profile banner with cyan accents.</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="1160" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.52" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="accent" x1="310" y1="0" x2="890" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#22D3EE" stop-opacity=".24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#020617" flood-opacity=".7"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#background)"/>
  <circle cx="110" cy="25" r="220" fill="url(#glow)">
    <animate attributeName="opacity" values=".55;1;.55" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1090" cy="235" r="240" fill="url(#glow)">
    <animate attributeName="opacity" values="1;.5;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".24" stroke="#22D3EE">
    <path d="M0 45H210L250 85H365"/>
    <path d="M1200 55H1010L970 95H850"/>
    <path d="M0 220H165L205 180H320"/>
    <path d="M1200 215H1045L1005 175H890"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="250" cy="85" r="4"/>
    <circle cx="970" cy="95" r="4"/>
    <circle cx="205" cy="180" r="4"/>
    <circle cx="1005" cy="175" r="4"/>
  </g>

  <g filter="url(#shadow)" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">
    <text x="600" y="108" fill="#F8FAFC" font-size="54" font-weight="700" letter-spacing="1">Prakash Mani</text>
    <rect x="365" y="128" width="470" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="0;470;470" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="x" values="600;365;365" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="600" y="171" fill="#22D3EE" font-size="22" font-weight="600" letter-spacing="2">FULL-STACK &amp; MOBILE APP DEVELOPER</text>
    <text x="600" y="207" fill="#94A3B8" font-size="16" letter-spacing="3">WEB  •  ANDROID  •  iOS</text>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="258.5" rx="17.25" stroke="#164E63" stroke-width="1.5"/>
</svg>
